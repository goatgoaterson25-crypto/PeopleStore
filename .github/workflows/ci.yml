name: PeopleStore CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Verify Backend
        run: |
          cd backend
          npm install
          npx prisma generate
          echo "Build and Prisma engine generation succeeded on GitHub Cloud!"
